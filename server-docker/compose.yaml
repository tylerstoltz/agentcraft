# Dedicated MC 26.3 Fabric server in Docker, running AgentCraft for LAN multiplayer.
# Setup: README.md in this folder. In short:
#
#   (cd ../mod && sh ./gradlew build) && mkdir -p mods && cp ../mod/build/libs/agentcraft-*.jar mods/
#   cp .env.example .env            # edit players, world, game mode
#   docker compose up -d && docker attach agentcraft-mc   (detach: Ctrl-P Ctrl-Q)
#
# network_mode: host is LOAD-BEARING. The server dials the Foreman on ws://127.0.0.1:${AGENTCRAFT_PORT}
# and the Foreman only accepts loopback, so the container shares the host's network namespace and the
# Foreman (run on the host: it needs the repo, git worktrees and your claude login) stays unreachable
# from the LAN. Consequence: `ports:` is ignored; the game port binds on every interface.
# This needs a Linux host running Docker Engine. Docker Desktop (macOS/Windows) runs containers in a
# VM, where "host" is the VM, not your machine: the server cannot reach a Foreman on your 127.0.0.1.
name: agentcraft          # explicit: a bare "server-docker" project collides with other mods' servers
services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: agentcraft-mc
    tty: true
    stdin_open: true
    network_mode: host
    environment:
      EULA: "TRUE"
      TYPE: "FABRIC"
      VERSION: "26.3"
      FABRIC_LOADER_VERSION: "0.19.5"
      # Fabric API from Modrinth, pinned to the version the mod builds against (mod/gradle.properties
      # fabric_api_version); the AgentCraft jar comes from ./mods (copied into /data/mods).
      MODRINTH_PROJECTS: "fabric-api:${FABRIC_API_VERSION:-0.161.0+26.3}"
      MEMORY: "4G"
      SERVER_PORT: "${MC_PORT:-25565}"
      MOTD: "AgentCraft studio"
      # Any world this server runs is the HQ world; the HQ builds itself on first start.
      AGENTCRAFT_HQ: "1"
      AGENTCRAFT_PORT: "${AGENTCRAFT_PORT:-7878}"
      AGENTCRAFT_HQ_SITE: "${AGENTCRAFT_HQ_SITE:-}"
      AGENTCRAFT_HQ_SEARCH: "${AGENTCRAFT_HQ_SEARCH:-}"
      # all (default): every player may watch the studio; trusted: only ops / allowlisted players
      AGENTCRAFT_RELAY_WATCH: "${AGENTCRAFT_RELAY_WATCH:-all}"
      # World, read when it is created (an existing data/<level> keeps its own). Defaults give the
      # classic studio: a superflat meadow, creative, peaceful. For survival on real terrain set
      # MC_LEVEL_TYPE=minecraft:normal MC_STRUCTURES=true MC_GAMEMODE=survival MC_DIFFICULTY=normal.
      LEVEL: "${MC_LEVEL:-AgentCraft HQ}"
      LEVEL_TYPE: "${MC_LEVEL_TYPE:-minecraft:flat}"
      GENERATOR_SETTINGS: '{"biome":"minecraft:plains","layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:stone","height":124},{"block":"minecraft:dirt","height":3},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}'
      GENERATE_STRUCTURES: "${MC_STRUCTURES:-false}"
      SEED: "${MC_SEED:-}"
      MODE: "${MC_GAMEMODE:-creative}"
      DIFFICULTY: "${MC_DIFFICULTY:-peaceful}"
      HARDCORE: "${MC_HARDCORE:-false}"
      # Trusted LAN players only. Ops (and names in data/config/agentcraft-allowlist.json) may drive
      # the agents and edit the HQ site; everyone else watches and plays around it.
      ENABLE_WHITELIST: "TRUE"
      WHITELIST: "${MC_WHITELIST:-}"
      OPS: "${MC_OPS:-}"
      # The HQ sets its own spawn; vanilla spawn protection would only get in the way.
      SPAWN_PROTECTION: "0"
      # RCON stays off: with host networking it would listen on every interface.
      ENABLE_RCON: "FALSE"
      UID: 1000
      GID: 1000
    volumes:
      - ./data:/data
      - ./mods:/mods:ro
    stop_grace_period: 2m
    restart: "no"
